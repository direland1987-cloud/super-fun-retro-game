<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SCUTE SPRINT</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0a10; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #crt { position: absolute; left: 0; top: 0; pointer-events: none; display: none;
         background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 3px);
         mix-blend-mode: multiply; }
  #crt.on { display: block; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  /* touch controls (shown on touch devices) */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; font-family: monospace; }
  #touch.on { display: block; }
  .tbtn { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.45);
          color: #fff; display: flex; align-items: center; justify-content: center; font-size: 3.2vmin; font-weight: bold; letter-spacing: 1px; touch-action: none; }
  .tbtn.down { background: rgba(246,192,74,0.55); border-color: #f6c04a; }
  #tJump   { right: 4vmin;  bottom: 6vmin;  width: 20vmin; height: 20vmin; }
  #tAttack { right: 26vmin; bottom: 4vmin;  width: 16vmin; height: 16vmin; }
  #tRoll   { right: 22vmin; bottom: 23vmin; width: 14vmin; height: 14vmin; }
  .tsmall  { width: 9vmin; height: 9vmin; font-size: 2.4vmin; top: 2vmin; border-radius: 1.5vmin; }
  #tPause  { right: 2vmin; }  #tRestart { right: 13vmin; }  #tMute { right: 24vmin; }  #tFull { right: 35vmin; }
  #tStick  { position: absolute; left: 0; bottom: 0; width: 46vw; height: 70vh; pointer-events: auto; touch-action: none; }
  #tStickBase { position: absolute; width: 26vmin; height: 26vmin; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); display: none; transform: translate(-50%, -50%); }
  #tStickKnob { position: absolute; width: 11vmin; height: 11vmin; border-radius: 50%; background: rgba(255,255,255,0.45); display: none; transform: translate(-50%, -50%); }
  #tHint { position: absolute; left: 2vmin; top: 2vmin; color: rgba(255,255,255,0.6); font-size: 2.4vmin; }

<body>
<div id="wrap"><canvas id="screen" width="384" height="216"></canvas><div id="crt"></div></div>
<div id="touch">

  <div class="tbtn" id="tAttack" data-b="attack">HIT</div>

<script>
'use strict';
// =====================================================================================
//  SCUTE SPRINT  -  a single-file retro speedrun platformer
//  Hero: Scute, a scrappy pangolin in a bandana.
//  Everything in this file (code, art, levels, music) is original.
// =====================================================================================

// ---------------------------------------------------------------- PHYSICS CONSTANTS --
// All speeds are in pixels per 60Hz tick. Tune here.
const PHYS = {
  GRAVITY: 0.30,        // downward accel per tick
  MAX_FALL: 6.5,        // terminal velocity
  RUN_ACCEL: 0.14,      // ground accel
  RUN_DECEL: 0.24,      // ground friction when no input
  SKID_DECEL: 0.40,     // turning around on the ground
  RUN_MAX: 2.3,         // top walking/running speed
  AIR_ACCEL: 0.12,      // horizontal control in the air
  AIR_DRAG: 0.01,       // slow drift in the air when above RUN_MAX
  JUMP_VEL: -5.4,       // initial jump velocity (clears 3 tiles)
  JUMP_CUT: -1.6,       // vy clamp when jump released early
  COYOTE: 6,            // ticks after leaving a ledge where jump still works (~100ms)
  JUMP_BUFFER: 6,       // ticks a jump press is remembered before landing
  STOMP_BOUNCE: -3.6,   // bounce off an enemy
  STOMP_BOUNCE_HOLD: -5.4, // bounce when holding jump
  STEP_HEIGHT: 9,       // max step the hero snaps up/down while grounded
  ROLL_MIN: 0.9,        // below this ground speed a roll becomes a crouch
  ROLL_FRICTION: 0.012, // rolling friction on flat ground
  ROLL_SLOPE: 0.26,     // slope acceleration while rolling (times slope steepness)
  ROLL_MAX: 7.5,        // top rolling speed
  SPIN_START: 3.0,      // spin dash speed on first charge
  SPIN_STEP: 1.4,       // extra speed per charge tap
  SPIN_MAX: 8.0,        // max spin dash release speed
  SPIN_DECAY: 0.03,     // charge bleed per tick while held
  UPPER_VEL: -6.6,      // rising uppercut launch velocity
  UPPER_FWD: 1.4,       // uppercut forward push
  FIREBALL_SPEED: 4.2,  // hero projectile speed
  FIREBALL_LIFE: 70,    // ticks
  HURT_KNOCK_X: 2.6,    // knockback when hit
  HURT_KNOCK_Y: -3.4,
  INVULN: 80,           // ticks of invulnerability after a hit
  SPRING_VEL: -8.4,     // spring launch
  DASH_PAD: 7.0,        // dash pad speed
  LOOP_MIN: 3.0,        // min speed to stay on the top half of a loop
  CURVE_GRAVITY: 0.5,   // gravity scale while riding loops/quarter pipes (lower = more forgiving)
  PUNCH1: 12, PUNCH2: 12, PUNCH3: 22,   // attack durations in ticks
  COMBO_WINDOW: 14,     // ticks after a punch ends where the next one chains
  MOTION_WINDOW: 18,    // ticks for special-move motion inputs
  HITSTOP_BIG: 7,       // frames frozen on a big hit
  BIKE_JUMP: -5.0, BIKE_GRAVITY: 0.32, BIKE_SPEEDS: [3.0, 4.0, 5.0],
  LADDER_SPEED: 1.4,
  CANNON_SPEED: 7.0,
  RESPAWN_DELAY: 24,    // ticks between death and respawn
};

const W = 384, H = 216, TILE = 16;

// ---------------------------------------------------------------------- UTILITIES ----
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const fmtTime = ms => {
  ms = Math.max(0, Math.round(ms));
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), c = Math.floor((ms % 1000) / 10);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + (c < 10 ? '0' : '') + c;
};
const fmtDiff = ms => (ms < 0 ? '-' : '+') + fmtTime(Math.abs(ms)).slice(1);
const ticksToMs = t => t * 1000 / 60;

// Seeded RNG for deterministic replays/ghosts where it matters
let seed = 1;
const srand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

// --------------------------------------------------------------------- STORAGE ------
const SAVE_KEY = 'scuteSprint.save.v1';
const Storage = {
  data: { best: {}, run: null, splits: null, ghosts: {}, crt: false, mute: false },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) { const d = JSON.parse(raw); Object.assign(this.data, d); }
    } catch (e) { /* storage unavailable: run without persistence */ }
  },
  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
  },
};
Storage.load();

// ------------------------------------------------------------------ TOUCH CONTROLS ---
// Floating stick on the left half (8-way, so down-forward motions work), buttons on the right.
const Touch = {
  active: false, stickId: null, sx: 0, sy: 0,
  init() {
    const root = document.getElementById('touch'); if (!root) return;
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const show = () => { if (!this.active) { this.active = true; root.className = 'on'; } };
    if (isTouch) show();
    window.addEventListener('touchstart', show, { passive: true });
    const st = Input.touch;
    for (const el of root.querySelectorAll('.tbtn')) {
      const b = el.dataset.b; const pts = new Set();
      const press = e => { e.preventDefault(); Audio.unlock(); pts.add(e.pointerId); el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch (x) {}
        if (b === 'full') { this.fullscreen(); return; } st[b] = true; };
      const release = e => { pts.delete(e.pointerId); if (!pts.size) { el.classList.remove('down'); st[b] = false; } };
      el.addEventListener('pointerdown', press); el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    }
    const zone = document.getElementById('tStick'), base = document.getElementById('tStickBase'), knob = document.getElementById('tStickKnob');
    const clear = () => { st.left = st.right = st.up = st.down = false; base.style.display = knob.style.display = 'none'; this.stickId = null; };
    const moveTo = (x, y) => {
      const r = zone.getBoundingClientRect(); const dx = x - this.sx, dy = y - this.sy; const d = Math.hypot(dx, dy);
      const dead = Math.min(r.width, r.height) * 0.06, max = Math.min(r.width, r.height) * 0.22;
      const k = d > max ? max / d : 1; knob.style.left = (this.sx + dx * k - r.left) + 'px'; knob.style.top = (this.sy + dy * k - r.top) + 'px';
      st.left = st.right = st.up = st.down = false;
      if (d < dead) return;
      const a = Math.atan2(dy, dx); // 8-way sectors, each 45 degrees wide, diagonals included
      const sec = Math.round(a / (Math.PI / 4));
      st.right = sec === 0 || sec === 1 || sec === -1; st.left = Math.abs(sec) >= 3; st.down = sec >= 1 && sec <= 3; st.up = sec <= -1 && sec >= -3;
    };
    zone.addEventListener('pointerdown', e => { e.preventDefault(); Audio.unlock(); if (this.stickId !== null) return; this.stickId = e.pointerId; this.sx = e.clientX; this.sy = e.clientY;
      const r = zone.getBoundingClientRect(); base.style.left = knob.style.left = (e.clientX - r.left) + 'px'; base.style.top = knob.style.top = (e.clientY - r.top) + 'px'; base.style.display = knob.style.display = 'block';
      try { zone.setPointerCapture(e.pointerId); } catch (x) {} });
    zone.addEventListener('pointermove', e => { if (e.pointerId === this.stickId) moveTo(e.clientX, e.clientY); });
    const end = e => { if (e.pointerId === this.stickId) clear(); };
    zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end); zone.addEventListener('lostpointercapture', end);
  },
  fullscreen() {
    const d = document.documentElement;
    try {
      if (!document.fullscreenElement) { const p = d.requestFullscreen ? d.requestFullscreen() : d.webkitRequestFullscreen && d.webkitRequestFullscreen(); if (p && p.then) p.then(() => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (x) {} }).catch(() => {}); }
      else if (document.exitFullscreen) document.exitFullscreen();
    } catch (x) { /* not supported */ }
  },
};

// ----------------------------------------------------------------------- INPUT -------
// Logical buttons: left,right,up,down,jump,attack,roll,pause,restart,restartRun,mute,crt
const Input = {
  held: {}, pressed: {}, released: {}, prevHeld: {},
  gpPrev: {},
  keymap: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyZ: 'jump', Space: 'jump', KeyX: 'attack', KeyC: 'roll',
    Enter: 'pause', Escape: 'pause', KeyR: 'restart', KeyM: 'mute', KeyT: 'crt', KeyG: 'ghost',
  },
  raw: {},
  touch: {},
  anyKey: false,
  init() {
    Touch.init();
    window.addEventListener('keydown', e => {
      if (e.repeat) { if (this.keymap[e.code]) e.preventDefault(); return; }
      const b = this.keymap[e.code];
      this.anyKey = true;
      Audio.unlock();
      if (b) { e.preventDefault(); if (b === 'restart' && e.shiftKey) this.raw.restartRun = true; else this.raw[b] = true; }
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.raw.shift = true;
    });
    window.addEventListener('keyup', e => {
      const b = this.keymap[e.code];
      if (b) { e.preventDefault(); this.raw[b] = false; this.raw.restartRun = false; }
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.raw.shift = false;
    });
    window.addEventListener('blur', () => { for (const k in this.raw) this.raw[k] = false; });
  },
  pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; break; }
    if (!gp) return {};
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const g = {
      left: b(14) || ax < -0.5, right: b(15) || ax > 0.5, up: b(12) || ay < -0.5, down: b(13) || ay > 0.5,
      jump: b(0), attack: b(1) || b(3), roll: b(2) || b(5) || b(7), pause: b(9), restart: b(8),
    };
    if (g.left || g.right || g.up || g.down || g.jump || g.attack || g.roll || g.pause) { this.anyKey = true; Audio.unlock(); }
    return g;
  },
  update() {
    const g = this.pollGamepad(), t = this.touch;
    this.prevHeld = this.held; this.held = {}; this.pressed = {}; this.released = {};
    const names = ['left', 'right', 'up', 'down', 'jump', 'attack', 'roll', 'pause', 'restart', 'restartRun', 'mute', 'crt', 'ghost'];
    for (const n of names) {
      const h = !!(this.raw[n] || g[n] || t[n]);
      this.held[n] = h;
      if (h && !this.prevHeld[n]) this.pressed[n] = true;
      if (!h && this.prevHeld[n]) this.released[n] = true;
    }
    // Shift+R: treat as restartRun when R pressed with shift held via gamepad too (select+start)
    if (g.restart && g.pause) { this.held.restartRun = true; if (!this.prevHeld.restartRun) this.pressed.restartRun = true; this.pressed.restart = false; this.pressed.pause = false; }
  },
  consume(n) { this.pressed[n] = false; },
};

// ----------------------------------------------------------------------- AUDIO -------
// Chiptune sequencer + synthesized SFX. Everything is generated at runtime.
const NOTE_IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
function noteFreq(tok) {
  const m = /^([A-G][#b]?)(\d)$/.exec(tok);
  if (!m) return 0;
  const midi = 12 * (parseInt(m[2]) + 1) + NOTE_IDX[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

const Audio = {
  ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  muted: !!Storage.data.mute, unlocked: false,
  music: { name: null, step: 0, nextTime: 0, timer: null, def: null, nodes: [] },
  unlock() {
    if (this.unlocked) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.9; this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 1; this.sfxGain.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.unlocked = true;
      if (this.music.pending) { const p = this.music.pending; this.music.pending = null; this.play(p); }
    } catch (e) { /* no audio */ }
  },
  toggleMute() {
    this.muted = !this.muted; Storage.data.mute = this.muted; Storage.save();
    if (this.master) this.master.gain.value = this.muted ? 0 : 1;
  },
  sfx(name) {
    if (!this.unlocked) return;
    const s = SFX[name]; if (!s) return;
    const ctx = this.ctx, t0 = ctx.currentTime;
    const steps = s.steps || [0];
    for (const st of steps) {
      const t = t0 + st;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = s.w; o.frequency.setValueAtTime(s.f[0], t); o.frequency.exponentialRampToValueAtTime(Math.max(20, s.f[1]), t + s.d);
      g.gain.setValueAtTime(s.v, t); g.gain.exponentialRampToValueAtTime(0.001, t + s.d);
      o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + s.d + 0.02);
    }
    if (s.noise) {
      const n = ctx.createBufferSource(); n.buffer = this.noiseBuf;
      const g = ctx.createGain(); g.gain.setValueAtTime(s.noise, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + s.d);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
      n.connect(f); f.connect(g); g.connect(this.sfxGain); n.start(t0); n.stop(t0 + s.d + 0.02);
    }
  },
  play(name) {
    if (!this.unlocked) { this.music.pending = name; return; }
    if (this.music.name === name) return;
    this.stop();
    const def = MUSIC[name]; if (!def) return;
    const m = this.music; m.name = name; m.def = def; m.step = 0; m.nextTime = this.ctx.currentTime + 0.05;
    m.tracks = def.tracks.map(t => ({ ...t, toks: t.pat.trim().split(/\s+/), last: 0 }));
    m.drums = def.drums.trim().split(/\s+/);
    m.len = Math.max(m.drums.length, ...m.tracks.map(t => t.toks.length));
    m.timer = setInterval(() => this.schedule(), 40);
    this.schedule();
  },
  stop() {
    const m = this.music;
    if (m.timer) clearInterval(m.timer);
    m.timer = null; m.name = null; m.pending = null;
    for (const n of m.nodes) { try { n.stop(); } catch (e) {} }
    m.nodes = [];
  },
  schedule() {
    const m = this.music, ctx = this.ctx;
    if (!m.def) return;
    const stepDur = 60 / m.def.bpm / 4;
    while (m.nextTime < ctx.currentTime + 0.15) {
      const t = m.nextTime, i = m.step % m.len;
      for (const tr of m.tracks) {
        const tok = tr.toks[i % tr.toks.length];
        if (tok === '.' || tok === '-') { continue; }
        // count holds following this note
        let hold = 1; for (let j = 1; j < 16; j++) { if (tr.toks[(i + j) % tr.toks.length] === '.') hold++; else break; }
        const f = noteFreq(tok); if (!f) continue;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = tr.wave; o.frequency.value = f;
        const dur = stepDur * hold;
        g.gain.setValueAtTime(tr.vol, t); g.gain.setValueAtTime(tr.vol, t + dur * 0.6);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.6 + Math.max(0.02, tr.dec * stepDur * 2));
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + dur + tr.dec * stepDur * 2 + 0.05);
        m.nodes.push(o);
      }
      const dr = m.drums[i % m.drums.length];
      if (dr && dr !== '.') this.drum(dr, t);
      m.nextTime += stepDur; m.step++;
      if (m.nodes.length > 200) m.nodes.splice(0, 100);
    }
  },
  drum(kind, t) {
    const ctx = this.ctx;
    if (kind === 'k') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.16); this.music.nodes.push(o);
    } else {
      const n = ctx.createBufferSource(); n.buffer = this.noiseBuf;
      const g = ctx.createGain(); const f = ctx.createBiquadFilter();
      if (kind === 's') { f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); }
      else { f.type = 'highpass'; f.frequency.value = 6000; g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); }
      n.connect(f); f.connect(g); g.connect(this.musicGain); n.start(t); n.stop(t + 0.15); this.music.nodes.push(n);
    }
  },
};

  M: '101111111101101', N: '110101101101101', O: '111101101101111', P: '111101111100100', Q: '111101101111001', R: '110101110101101',

};
const fontCache = {};
function glyphCanvas(ch, color) {
  const key = ch + color;
  if (fontCache[key]) return fontCache[key];
  const bits = FONT_GLYPHS[ch] || FONT_GLYPHS['?'];
  const c = document.createElement('canvas'); c.width = 3; c.height = 5;
  const g = c.getContext('2d'); g.fillStyle = color;
  for (let i = 0; i < 15; i++) if (bits[i] === '1') g.fillRect(i % 3, Math.floor(i / 3), 1, 1);
  fontCache[key] = c; return c;
}
// Draw text. align: 'left' | 'center' | 'right'. scale integer.
function text(ctx, str, x, y, color, opts) {
  opts = opts || {};
  const scale = opts.scale || 1, align = opts.align || 'left';
  str = String(str).toUpperCase();
  const w = str.length * 4 * scale - scale;
  if (align === 'center') x -= Math.floor(w / 2); else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (opts.shadow) {
    for (let i = 0; i < str.length; i++) ctx.drawImage(glyphCanvas(str[i], opts.shadow), x + i * 4 * scale + scale, y + scale, 3 * scale, 5 * scale);
  }
  for (let i = 0; i < str.length; i++) ctx.drawImage(glyphCanvas(str[i], color), x + i * 4 * scale, y, 3 * scale, 5 * scale);
  return w;
}

// Pixel sprite compiler: array of strings -> canvas. Legend maps chars to colors ('.' transparent).
const spriteCache = new Map();
function makeSprite(rows, legend, key) {
  if (key && spriteCache.has(key)) return spriteCache.get(key);
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = legend[ch]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  if (key) spriteCache.set(key, c);
  return c;
}

  const key = spr; // use canvas identity
  if (spr._flipped) return spr._flipped;
  const c = document.createElement('canvas'); c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d'); g.translate(spr.width, 0); g.scale(-1, 1); g.drawImage(spr, 0, 0);
  spr._flipped = c; return c;
}
function tinted(spr, color) {

  spr._tints = spr._tints || {};
  if (spr._tints[color]) return spr._tints[color];
  const c = document.createElement('canvas'); c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d'); g.drawImage(spr, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  spr._tints[color] = c; return c;
}

// Curve: loop ('loop') or quarter pipe ('qpipe', dir +1 for '(' and -1 for ')').

  constructor(cx, cy, r, kind, dir) { super(cx - r, cy - r, r * 2, r * 2); this.cxp = cx; this.cyp = cy; this.r = r; this.kind = kind; this.dir = dir || 1; this.cooldown = 0; }

    const c = { cx: this.cxp, cy: this.cyp, r: this.r, kind: this.kind, dir: this.dir, cooldown: 0, ent: this };

  introTimer: 0, resultTimer: 0, lastSplit: null, crt: !!Storage.data.crt, flash: 0,

  // ---- flow
  startRun() { this.mode = 'run'; this.runTicks = 0; this.splits = []; this.startLevel(0); },
  startPractice(i) { this.mode = 'practice'; this.runTicks = 0; this.splits = []; this.startLevel(i); },
  startLevel(i) {
    this.levelIdx = i; this.level = LEVELS[i]; this.levelTicks = 0; this.timeBonus = 0; this.coins = 0; this.deaths = 0; this.levelDone = false;
    this.hero = new Hero(); this.hero.gems = 0;
    this.ghostRec = []; const gd = Storage.data.ghosts[this.level.id]; this.ghostPlay = gd ? gd : null;
    this.loadStage(0, true);
    this.state = 'intro'; this.introTimer = 0; Audio.play(this.level.music);
  },
  loadStage(idx, fresh) {
    const lv = this.level; this.stageIdx = idx; this.stage = lv.stages[idx];
    this.map = new TileMap(this.stage.map); this.theme = THEMES[this.stage.theme];
    this.ents = []; this.springs = {}; this.bumps = {}; this.toasts = []; Particles.clear(); hitstop = 0;
    this.bonus = null; this.bike = null; this.roundState = null;
    const h = this.hero; const prevHp = h.hp;
    h.reset(0, 0); h.control = true;
    if (lv.id === 'l3') { h.maxHp = 100; h.hp = 100; }
    else if (this.stage.kind === 'brawl') { h.maxHp = 3; h.hp = 3; }
    else { h.maxHp = 0; h.hp = 0; }
    let start = null, cpIdx = 0;
    for (const s of this.map.spawns) {
      const x = s.tx * TILE, y = s.ty * TILE;
      switch (s.ch) {
        case 'x': start = { x: x + 3, y: y + 2 }; break;
        case 'c': this.ents.push(new Checkpoint(x, y, ++cpIdx)); break;
        case 'G': this.ents.push(new Goal(x, y, lv.id === 'l1' ? 'pole' : 'gate', this.map)); break;
        case 'w': this.ents.push(new Walker(x + 2, y)); break;
        case 'k': this.ents.push(new Shell(x + 1, y)); break;
        case 'f': this.ents.push(new Flyer(x + 2, y + 4)); break;
        case 'b': this.ents.push(new Thug(x, y)); break;
        case 'o': this.ents.push(new Gem(x + 5, y + 5, lv.id === 'l1' ? 'coin' : 'gem')); break;
        case 'P': this.ents.push(new ShieldItem(x + 4, y + 8)); break;
        case 'M': this.ents.push(new MalletItem(x, y)); break;
        case 'K': this.ents.push(new Crate(x, y)); break;
        case 'O': this.ents.push(new Curve(x + 8, y + 8, 40, 'loop')); break;
        case '(': this.ents.push(new Curve(x, y + 16 - 48, 48, 'qpipe', 1)); break;
        case ')': this.ents.push(new Curve(x + 16, y + 16 - 48, 48, 'qpipe', -1)); break;
        case 'C': { const spec = (this.stage.cannons || {})[s.tx + ',' + s.ty] || {}; this.ents.push(new Cannon(x + 8, y + 8, spec.a0 !== undefined ? spec.a0 : -Math.PI / 2 - 0.6, spec.a1 !== undefined ? spec.a1 : -Math.PI / 2 + 0.6, spec.speed || 0.035)); break; }
        case '@': this.boss = new CraneBoss(x + 8, y + 8); this.ents.push(this.boss); break;
        case 'E': this.ents.push(Object.assign(new Entity(x, y - 4, 16, 20), { bikePickup: true, update(G) { this.anim++; if (aabb(this, G.hero) && !G.hero.dead) { G.nextStage(); } }, draw(ctx, cx, cy) { drawBike(ctx, Math.round(this.x - cx), Math.round(this.y + 10 - cy + Math.sin(this.anim * 0.1) * 2), this.anim, false); if (this.anim & 8) text(ctx, 'RIDE!', Math.round(this.cx - cx), Math.round(this.y - 10 - cy), PAL.yellow, { align: 'center' }); } }));
          break;
        case 'Y': this.rivalSpawn = { x: x + 1, y: y }; break;
        case 'n': case 'm': case '_': case '>': case '|': this.bikeMarkers = this.bikeMarkers || []; break;
      }
    }
    if (this.stage.kind === 'bike') this.setupBike();
    if (this.stage.kind === 'duel') this.setupDuel();
    if (this.stage.kind === 'bonus') this.setupBonus();
    if (!start) start = { x: 24, y: 0 };
    this.stageStart = start;
    if (fresh || !this.checkpoint || this.checkpoint.stage !== idx) { this.checkpoint = { x: start.x, y: start.y, stage: idx, idx: 0 }; }
    h.x = this.checkpoint.x; h.y = this.checkpoint.y; h.lastGround = { x: h.x, y: h.y };
    if (this.stage.kind === 'bike') { h.state = 'bike'; }
    // activate checkpoints already passed
    for (const e of this.ents) if (e instanceof Checkpoint && e.idx <= this.checkpoint.idx) e.active = true;
    if (lv.id === 'l3' && !fresh) { h.hp = 100; }
    Camera.lockY = null;
    Camera.snap(clamp(h.cx - W / 2, 0, Math.max(0, this.map.pw - W)), clamp(h.feet - H * 0.72, 0, Math.max(0, this.map.ph - H)));
    if (this.stage.lockCameraY !== undefined) Camera.lockY = this.stage.lockCameraY;
  },
  nextStage() {
    if (this.stageIdx + 1 >= this.level.stages.length) { this.levelComplete(); return; }
    const h = this.hero; const keepHp = h.hp;
    this.checkpoint = null;
    this.loadStage(this.stageIdx + 1, false);
    Audio.sfx('checkpoint');
    if (this.stage.kind === 'brawl') { h.hp = keepHp; }
  },
  setCheckpoint(cp) { this.checkpoint = { x: cp.x, y: cp.y + cp.h - 14, stage: this.stageIdx, idx: cp.idx }; },
  onHeroDeath() { this.deaths++; },
  respawn() {
    const h = this.hero;
    if (this.stage.kind === 'duel' || this.stage.kind === 'bonus') { this.loadStage(this.stageIdx, false); return; }
    if (this.stage.kind === 'bike') { this.loadStage(this.stageIdx, false); return; }
    this.loadStage(this.stageIdx, false);
  },
  levelComplete() {
    if (this.levelDone) return; this.levelDone = true;
    const lv = this.level, ms = this.levelTime();
    this.resultTimer = 0; Audio.sfx('win');
    // splits & bests
    const best = Storage.data.best[lv.id];
    const prevBest = best ? best.time : null;
    const isPB = prevBest === null || ms < prevBest;
    this.lastSplit = { time: ms, prev: prevBest, pb: isPB, medal: this.medalFor(lv, ms) };
    if (isPB) { Storage.data.best[lv.id] = { time: ms, date: Date.now() }; if (this.ghostRec.length) Storage.data.ghosts[lv.id] = this.ghostRec.slice(); }
    if (this.mode === 'run') {
      this.splits.push(ms);
      const pbRun = Storage.data.run;
      this.lastSplit.runDiff = pbRun && pbRun.splits[this.levelIdx] !== undefined ? ms - pbRun.splits[this.levelIdx] : null;
    }
    Storage.save();
    this.state = 'results'; this.hero.control = false;
  },
  medalFor(lv, ms) { return ms <= lv.targets[0] ? 'GOLD' : ms <= lv.targets[1] ? 'SILVER' : ms <= lv.targets[2] ? 'BRONZE' : null; },
  levelTime() { return Math.max(0, ticksToMs(this.levelTicks) - this.timeBonus); },
  runTime() { return this.splits.reduce((a, b) => a + b, 0) + (this.state === 'playing' || this.state === 'paused' || this.state === 'intro' ? this.levelTime() : 0); },
  afterResults() {
    if (this.mode === 'run') {
      if (this.levelIdx + 1 < LEVELS.length) { this.startLevel(this.levelIdx + 1); }
      else {

  // ---- interactions

  // ---- per-tick update
  update() {
    const inp = Input;
    this.frame++;

    if (inp.pressed.crt) { this.crt = !this.crt; Storage.data.crt = this.crt; Storage.save(); document.getElementById('crt').className = this.crt ? 'on' : ''; }
    if (inp.pressed.ghost) { this.showGhost = !this.showGhost; Storage.data.ghost = this.showGhost; Storage.save(); if (this.state === 'playing') this.toast(this.showGhost ? 'GHOST ON' : 'GHOST OFF'); }

      case 'intro': {
        this.introTimer++;

        break;
      }
      case 'playing': {

        if (inp.pressed.restartRun) { this.restartRun(); break; }

        break;
      }
      case 'paused': this.updatePaused(inp); break;
      case 'results': {
        this.resultTimer++;

      }
      case 'runcomplete': {

        if (this.resultTimer > 60 && (inp.pressed.jump || inp.pressed.pause || inp.pressed.attack)) { this.state = 'title'; this.menu = 0; }

      }

  },
  updatePlaying(inp) {
    const h = this.hero;

    if (!this.levelDone) this.levelTicks++;

    for (const k in this.springs) if (--this.springs[k] <= 0) delete this.springs[k];

  },
  updateTitle(inp) {

  },
};

// -------------------------------------------------------------------- RENDERING ------
function drawBike(ctx, x, y, anim, moving) {

  ctx.fillStyle = glow ? '#5fd8e8' : '#2a8aa0'; ctx.fillRect(x + 2, y - 2, 6, 3); ctx.fillRect(x + 14, y - 2, 6, 3);
  ctx.fillStyle = PAL.greyD; ctx.fillRect(x, y - 8, 22, 6); ctx.fillStyle = PAL.grey; ctx.fillRect(x + 1, y - 8, 20, 2);
  ctx.fillStyle = PAL.red; ctx.fillRect(x + 16, y - 11, 6, 4); ctx.fillStyle = PAL.outline; ctx.fillRect(x + 20, y - 13, 2, 5); ctx.fillRect(x + 18, y - 13, 4, 1);
  ctx.fillStyle = '#ff4fd8'; ctx.fillRect(x + 21, y - 7, 2, 3);
  if (moving) { ctx.fillStyle = glow ? '#fff' : '#5fd8e8'; ctx.fillRect(x - 4, y - 6, 4, 2); }
}

function drawGhost(ctx, camX, camY) {
  const g = G.ghostPlay; if (!g || !G.showGhost || G.levelDone) return;
  const i = Math.floor(G.levelTicks / 2) * 3; if (i + 2 >= g.length) return;
  const x = g[i], y = g[i + 1], fl = g[i + 2];
  if ((fl >> 2) !== G.stageIdx) return;
  ctx.save(); ctx.globalAlpha = 0.45;
  if (fl & 1) ctx.drawImage(tinted(HeroArt.ball[0], '#9fe8ff'), Math.round(x - 1 - camX), Math.round(y - camY));
  else { const spr = (fl & 2) ? flipSprite(HeroArt.body) : HeroArt.body; ctx.drawImage(tinted(spr, '#9fe8ff'), Math.round(x + 5 - 8 - camX), Math.round(y - 2 - camY)); }
  ctx.restore();
}

function drawWorld(ctx) {
  const camX = Camera.rx, camY = Camera.ry, h = G.hero;
  drawBackground(ctx, G.theme, Camera.x, Camera.y, G.frame, G.map);
  // curves behind tiles
  for (const e of G.ents) if (e instanceof Curve) e.draw(ctx, camX, camY, G.theme);
  drawTiles(ctx, G.map, G.theme, camX, camY, G.frame);
  // bike obstacles
  if (G.bike) drawBikeObstacles(ctx, camX, camY);
  drawGhost(ctx, camX, camY);
  for (const e of G.ents) if (!(e instanceof Curve) && e.onScreen(camX, camY, 48)) e.draw(ctx, camX, camY);
  // hero
  if (G.bike) {
    if (!h.dead || h.deadTimer < 10) { drawBike(ctx, Math.round(h.x - 6 - camX), Math.round(h.feet + 4 - camY + (h.onGround ? Math.round(Math.sin(G.frame * 0.4)) : 0)), G.frame, true); }
    h.state = G.bike.duck ? 'crouch' : 'normal'; const og = h.onGround; h.onGround = true; h.draw(ctx, camX, camY); h.onGround = og; if (h.state !== 'bike') h.state = 'bike';
  } else h.draw(ctx, camX, camY);
  Particles.draw(ctx, camX, camY);
  // speed lines
  if (h.speedLines > 3) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; for (let i = 0; i < h.speedLines; i++) { const y = (i * 37 + G.frame * 3) % H; const len = 20 + (i * 13) % 30; const x = (i * 71 + G.frame * 9) % (W + len) - len; ctx.fillRect(x, y, len, 1); } }
  if (h.state === 'spin') { ctx.fillStyle = 'rgba(255,255,255,0.25)'; const sx = Math.round(h.cx - camX), sy = Math.round(h.feet - camY); ctx.fillRect(sx - h.facing * 14, sy - 4, 8, 1); }
}

function drawBikeObstacles(ctx, camX, camY) {
  const b = G.bike, fy = b.floorY - camY;
  for (const o of b.obs) {
    const x = o.x - camX; if (x < -40 || x > W + 40) continue;
    if (o.kind === 'n') { ctx.fillStyle = PAL.greyD; ctx.fillRect(x + 2, fy - 14, 12, 14); ctx.fillStyle = PAL.yellow; for (let i = 0; i < 3; i++) ctx.fillRect(x + 2, fy - 12 + i * 5, 12, 2); ctx.fillStyle = PAL.outline; for (let i = 0; i < 3; i++) ctx.fillRect(x + 2 + (i * 4 + 2) % 12, fy - 12 + i * 5, 2, 2); }
    else if (o.kind === 'm') { ctx.fillStyle = PAL.greyD; ctx.fillRect(x + 2, fy - 60, 12, 49); ctx.fillStyle = '#ff4fd8'; ctx.fillRect(x + 2, fy - 13, 12, 2); ctx.fillStyle = PAL.yellow; for (let i = 0; i < 4; i++) ctx.fillRect(x + 2, fy - 58 + i * 10, 12, 2); }
    else if (o.kind === '>') { ctx.fillStyle = PAL.grey; ctx.beginPath(); ctx.moveTo(x, fy); ctx.lineTo(x + 16, fy - 10); ctx.lineTo(x + 16, fy); ctx.fill(); ctx.fillStyle = PAL.yellow; ctx.fillRect(x + 8, fy - 5, 8, 2); }
    else if (o.kind === '|') { ctx.fillStyle = (G.frame & 8) ? PAL.yellow : PAL.orange; ctx.fillRect(x + 6, fy - 40, 4, 40); ctx.fillRect(x - 4, fy - 44, 24, 4); }
  }
  // warnings for upcoming obstacles (~1s ahead)
  const h = G.hero;
  for (const o of b.obs) {
    const d = o.x - h.cx;
    if (d <= 0 || d > b.speed * 60 || !'nm_'.includes(o.kind)) continue;
    if ((G.frame >> 2) & 1) continue;
    const y = o.kind === 'm' ? fy - 56 : fy - 20;
    ctx.fillStyle = PAL.red; ctx.fillRect(W - 24, y - 6, 18, 14); ctx.fillStyle = PAL.yellow; text(ctx, '!', W - 15, y - 2, PAL.yellow, { align: 'center' });
    text(ctx, o.kind === 'm' ? 'DUCK' : o.kind === 'n' ? 'JUMP' : 'GAP', W - 15, y + 10, PAL.white, { align: 'center' });
  }
}

function drawHUD(ctx) {
  const h = G.hero, th = G.theme;
  const sh = th.hudShadow;
  // timer
  const t = G.mode === 'run' ? G.runTime() : G.levelTime();
  text(ctx, fmtTime(t), 6, 5, th.hud, { scale: 2, shadow: sh });
  if (G.mode === 'run') text(ctx, 'LV ' + fmtTime(G.levelTime()), 6, 18, th.hud, { shadow: sh });
  const best = Storage.data.best[G.level.id];
  if (best) text(ctx, 'PB ' + fmtTime(best.time), 6, G.mode === 'run' ? 26 : 18, '#c9c9d4', { shadow: sh });
  // split flash after a level (run mode)
  // right side status
  const lv = G.level.id;
  if (lv === 'l1') { ctx.drawImage(SPR.coin, W - 44, 5); text(ctx, 'X' + G.coins, W - 36, 6, th.hud, { shadow: sh }); if (h.shield) text(ctx, 'SHIELD', W - 36, 14, PAL.cyan, { shadow: sh }); }
  if (lv === 'l2') { ctx.drawImage(SPR.gem, W - 44, 5); text(ctx, 'X' + h.gems, W - 36, 6, h.gems === 0 && (G.frame & 16) ? PAL.red : th.hud, { shadow: sh }); }
  if (lv === 'l4') { if (h.mallet > 0) { ctx.drawImage(SPR.mallet, W - 50, 4); text(ctx, Math.ceil(h.mallet / 60) + 'S', W - 40, 6, PAL.yellow, { shadow: sh }); } }
  if (G.stage.kind === 'brawl') { for (let i = 0; i < h.maxHp; i++) { ctx.fillStyle = i < h.hp ? PAL.red : PAL.greyD; ctx.fillRect(W - 14 - i * 10, 6, 8, 7); ctx.fillStyle = PAL.white; if (i < h.hp) ctx.fillRect(W - 13 - i * 10, 7, 2, 2); } }
  if (G.stage.kind === 'bike') { text(ctx, 'PHASE ' + (G.bike.phase + 1), W - 6, 6, PAL.cyan, { align: 'right', shadow: sh }); }
  // level name small
  text(ctx, G.level.name, W / 2, 5, th.hud, { align: 'center', shadow: sh });
  // duel HUD
  if (G.roundState) drawDuelHUD(ctx);
  if (G.bonus) {
    const b = G.bonus; text(ctx, 'SMASH!', W / 2, 20, PAL.yellow, { align: 'center', scale: 2, shadow: sh });
    text(ctx, (Math.max(0, b.t) / 60).toFixed(1) + 'S', W / 2, 34, b.t < 180 && (G.frame & 8) ? PAL.red : PAL.white, { align: 'center', scale: 2, shadow: sh });
    text(ctx, 'CRATES ' + b.smashed + '/' + b.total + '   BONUS -' + (b.bonusMs / 1000).toFixed(1) + ' SEC', W / 2, 50, PAL.white, { align: 'center', shadow: sh });
  }
  // toasts
  let ty = H - 40;
  for (const tt of G.toasts) { const a = tt.t < 20 ? tt.t / 20 : 1; ctx.globalAlpha = a; text(ctx, tt.msg, W / 2, ty, PAL.yellow, { align: 'center', shadow: sh }); ctx.globalAlpha = 1; ty -= 9; }
  // death counter
  if (G.deaths > 0) text(ctx, 'DEATHS ' + G.deaths, W - 6, H - 8, '#c9c9d4', { align: 'right', shadow: sh });
}
function drawDuelHUD(ctx) {
  const h = G.hero, r = G.rival;
  const bar = (x, y, w, frac, right) => { ctx.fillStyle = PAL.black; ctx.fillRect(x - 1, y - 1, w + 2, 8); ctx.fillStyle = PAL.red; ctx.fillRect(x, y, w, 6); ctx.fillStyle = frac > 0.3 ? PAL.yellow : PAL.orange; const fw = Math.round(w * frac); ctx.fillRect(right ? x + w - fw : x, y, fw, 6); ctx.fillStyle = PAL.white; ctx.fillRect(right ? x + w - fw : x, y, fw, 1); };
  bar(W / 2 - 140, 30, 112, clamp(h.hp / h.maxHp, 0, 1), false);
  bar(W / 2 + 28, 30, 112, clamp(r.hp / r.maxHp, 0, 1), true);
  text(ctx, 'SCUTE', W / 2 - 140, 38, PAL.white, { shadow: PAL.black });
  text(ctx, r.cfg.name, W / 2 + 140, 38, PAL.white, { align: 'right', shadow: PAL.black });
  const secs = Math.ceil(G.roundClock / 60);
  text(ctx, String(secs), W / 2, 28, secs <= 10 && (G.frame & 8) ? PAL.red : PAL.white, { align: 'center', scale: 2, shadow: PAL.black });
  if (G.roundState === 'intro') {
    const t = G.roundTimer;
    if (t < 70) text(ctx, 'ROUND ' + G.roundNum, W / 2, 90, PAL.yellow, { align: 'center', scale: 3, shadow: PAL.black });
    else text(ctx, 'FIGHT!', W / 2, 90, (t & 4) ? PAL.red : PAL.white, { align: 'center', scale: 4, shadow: PAL.black });
    text(ctx, 'HOLD BACK TO BLOCK. JUMP OVER GRABS.', W / 2, 130, PAL.white, { align: 'center', shadow: PAL.black });
  }
  if (G.roundState === 'ko') text(ctx, 'K.O.!', W / 2, 90, (G.frame & 4) ? PAL.yellow : PAL.white, { align: 'center', scale: 4, shadow: PAL.black });
}

function drawTitle(ctx) {
  const f = G.frame;
  const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#1a1440'); grad.addColorStop(1, '#5a2a7a'); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 40; i++) if (((i * 7 + (f >> 3)) % 11) !== 0) ctx.fillRect((i * 97) % W, (i * 53) % 120, 1, 1);
  // ground band with running hero
  ctx.fillStyle = '#2e8b3a'; ctx.fillRect(0, 170, W, 46); ctx.fillStyle = '#5ec24e'; ctx.fillRect(0, 170, W, 3);
  ctx.fillStyle = '#c97a3f'; for (let i = 0; i < 25; i++) ctx.fillRect(((i * 16 - f) % (W + 16) + W + 16) % (W + 16) - 16, 178, 15, 7);
  // title
  const bob = Math.round(Math.sin(f * 0.05) * 2);
  text(ctx, 'SCUTE', W / 2, 26 + bob, PAL.yellow, { align: 'center', scale: 5, shadow: '#7a2e1c' });
  text(ctx, 'SPRINT', W / 2, 56 + bob, PAL.white, { align: 'center', scale: 4, shadow: '#24448a' });
  text(ctx, 'A FIVE-LEVEL SPEEDRUN GAUNTLET', W / 2, 82, '#c9c9d4', { align: 'center' });
  // mascot
  const hx = 60 + Math.round(Math.sin(f * 0.02) * 20), hy = 170;
  ctx.drawImage(HeroArt.body, hx - 8, hy - 16); ctx.fillStyle = PAL.fur; const ff = (f >> 2) % 4; ctx.fillRect(hx - 6 + (ff === 2 ? 7 : 0), hy - 3, 2, 3); ctx.fillRect(hx + 3 - (ff === 2 ? 7 : 0), hy - 3, 2, 3);
  if (G.menu === 0) {
    const items = ['FULL RUN', 'PRACTICE A LEVEL'];
    items.forEach((it, i) => { const sel = G.sub === i; text(ctx, (sel ? '> ' : '  ') + it + (sel ? ' <' : '  '), W / 2, 100 + i * 12, sel ? PAL.yellow : PAL.white, { align: 'center', scale: 1, shadow: PAL.black }); });
    const pb = Storage.data.run; if (pb) text(ctx, 'BEST RUN ' + fmtTime(pb.total), W / 2, 126, PAL.cyan, { align: 'center' });
    // controls
    const c = Touch.active
      ? ['LEFT HALF: DRAG STICK TO MOVE (DIAGONALS OK)', 'JUMP / HIT / ROLL BUTTONS ON THE RIGHT', 'TOP: II PAUSE   R RESTART   M MUTE   [ ] FULLSCREEN', 'SPECIALS:  DOWN,DOWN-FWD,FWD+HIT FIREBALL    FWD,DOWN,DOWN-FWD+HIT UPPERCUT']
      : ['ARROWS/WASD MOVE   Z/SPACE JUMP   X ATTACK   C ROLL/SPIN-DASH', 'ENTER PAUSE   R RESTART LEVEL   SHIFT+R RESTART RUN', 'M MUTE   T CRT SCANLINES   G GHOST   GAMEPAD OK', 'SPECIALS:  DOWN,DOWN-FWD,FWD+X FIREBALL    FWD,DOWN,DOWN-FWD+X UPPERCUT'];
    c.forEach((l, i) => text(ctx, l, W / 2, 138 + i * 8, i === 3 ? PAL.pink : '#e8e8f0', { align: 'center' }));
  } else {
    text(ctx, 'PRACTICE - PICK A LEVEL  (C: BACK)', W / 2, 96, PAL.white, { align: 'center', shadow: PAL.black });
    LEVELS.forEach((lv, i) => {
      const sel = G.sub === i; const b = Storage.data.best[lv.id];
      text(ctx, (sel ? '> ' : '  ') + (i + 1) + ' ' + lv.name, 40, 108 + i * 10, sel ? PAL.yellow : PAL.white, { shadow: PAL.black });
      text(ctx, b ? fmtTime(b.time) + ' ' + (G.medalFor(lv, b.time) || '') : '--:--.--', W - 40, 108 + i * 10, b ? medalColor(G.medalFor(lv, b.time)) : '#888', { align: 'right', shadow: PAL.black });
    });
    const lv = LEVELS[G.sub]; text(ctx, 'GOLD ' + fmtTime(lv.targets[0]) + '  SILVER ' + fmtTime(lv.targets[1]) + '  BRONZE ' + fmtTime(lv.targets[2]), W / 2, 162, '#c9c9d4', { align: 'center' });
  }
  if (!Audio.unlocked) text(ctx, Touch.active ? 'TAP JUMP TO START' : 'PRESS ANY KEY FOR SOUND', W / 2, H - 10, (f & 16) ? PAL.white : '#888', { align: 'center' });
  if (Touch.active && window.innerHeight > window.innerWidth && (f & 32)) text(ctx, 'ROTATE YOUR PHONE FOR A BIGGER VIEW', W / 2, H - 20, PAL.yellow, { align: 'center' });
}
function medalColor(m) { return m === 'GOLD' ? PAL.yellow : m === 'SILVER' ? PAL.greyL : m === 'BRONZE' ? PAL.orange : '#888'; }

function drawIntro(ctx) {
  drawWorld(ctx);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  const lv = G.level, t = G.introTimer;
  const slide = Math.max(0, 20 - t) * 8;
  text(ctx, 'LEVEL ' + (G.levelIdx + 1), W / 2 - slide, 60, PAL.yellow, { align: 'center', scale: 2, shadow: PAL.black });
  text(ctx, lv.name, W / 2 + slide, 80, PAL.white, { align: 'center', scale: 3, shadow: PAL.black });
  text(ctx, lv.tag, W / 2, 106, PAL.pink, { align: 'center', shadow: PAL.black });
  text(ctx, 'GOLD ' + fmtTime(lv.targets[0]) + '   SILVER ' + fmtTime(lv.targets[1]) + '   BRONZE ' + fmtTime(lv.targets[2]), W / 2, 124, '#c9c9d4', { align: 'center' });
  const b = Storage.data.best[lv.id]; if (b) text(ctx, 'YOUR BEST ' + fmtTime(b.time), W / 2, 136, PAL.cyan, { align: 'center' });
  if (lv.hint) text(ctx, lv.hint, W / 2, 152, PAL.white, { align: 'center' });
  if (t > 20) text(ctx, 'PRESS JUMP', W / 2, 180, (t & 16) ? PAL.white : '#888', { align: 'center' });
}
function drawPaused(ctx) {
  drawWorld(ctx); drawHUD(ctx);
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  text(ctx, 'PAUSED', W / 2, 60, PAL.yellow, { align: 'center', scale: 3, shadow: PAL.black });
  ['RESUME', 'RESTART LEVEL (R)', 'RESTART RUN (SHIFT+R)', 'QUIT TO TITLE'].forEach((it, i) => { const sel = G.pauseMenu === i; text(ctx, (sel ? '> ' : '') + it, W / 2, 96 + i * 12, sel ? PAL.yellow : PAL.white, { align: 'center' }); });
  text(ctx, 'M MUTE  T SCANLINES  G GHOST', W / 2, 160, '#888', { align: 'center' });
}
function drawResults(ctx) {
  drawWorld(ctx);
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  const s = G.lastSplit, lv = G.level, t = G.resultTimer;
  text(ctx, 'LEVEL ' + (G.levelIdx + 1) + ' CLEAR', W / 2, 30, PAL.yellow, { align: 'center', scale: 2, shadow: PAL.black });
  text(ctx, lv.name, W / 2, 46, PAL.white, { align: 'center' });
  if (t > 10) { text(ctx, 'TIME', W / 2 - 60, 66, '#c9c9d4'); text(ctx, fmtTime(s.time), W / 2 + 60, 64, PAL.white, { align: 'right', scale: 2 }); }
  if (t > 20 && G.timeBonus > 0) { text(ctx, 'BONUS', W / 2 - 60, 80, '#c9c9d4'); text(ctx, '-' + fmtTime(G.timeBonus).slice(3), W / 2 + 60, 80, PAL.cyan, { align: 'right' }); }
  if (t > 30) {
    text(ctx, 'BEST', W / 2 - 60, 92, '#c9c9d4');
    if (s.prev === null) text(ctx, 'FIRST CLEAR!', W / 2 + 60, 92, PAL.yellow, { align: 'right' });
    else { const d = s.time - s.prev; text(ctx, fmtDiff(d), W / 2 + 60, 92, d < 0 ? PAL.green : PAL.red, { align: 'right' }); if (s.pb) text(ctx, 'NEW PB!', W / 2 + 70, 92, (t & 8) ? PAL.yellow : PAL.white); }
  }
  if (t > 40 && G.mode === 'run' && s.runDiff !== null && s.runDiff !== undefined) { text(ctx, 'SPLIT VS PB RUN', W / 2 - 60, 104, '#c9c9d4'); text(ctx, fmtDiff(s.runDiff), W / 2 + 60, 104, s.runDiff < 0 ? PAL.green : PAL.red, { align: 'right' }); }
  if (t > 50) {
    const m = s.medal; const col = medalColor(m);
    if (m) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(W / 2, 134, 10, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = PAL.outline; ctx.beginPath(); ctx.arc(W / 2, 134, 10, 0, Math.PI * 2); ctx.stroke(); text(ctx, m, W / 2, 150, col, { align: 'center', scale: 2, shadow: PAL.black }); if (t === 51) Audio.sfx('medal'); }
    else text(ctx, 'NO MEDAL - BRONZE AT ' + fmtTime(lv.targets[2]), W / 2, 140, '#c9c9d4', { align: 'center' });
    text(ctx, 'GOLD ' + fmtTime(lv.targets[0]) + '  SILVER ' + fmtTime(lv.targets[1]) + '  BRONZE ' + fmtTime(lv.targets[2]), W / 2, 166, '#888', { align: 'center' });
    text(ctx, 'DEATHS ' + G.deaths, W / 2, 176, '#888', { align: 'center' });
  }
  if (t > 40) text(ctx, G.mode === 'run' ? (G.levelIdx + 1 < LEVELS.length ? 'JUMP: NEXT LEVEL   R: RETRY' : 'JUMP: FINISH RUN') : 'JUMP: BACK   R: RETRY', W / 2, 196, (t & 16) ? PAL.white : '#888', { align: 'center' });
}
function drawRunComplete(ctx) {
  const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#1a1440'); grad.addColorStop(1, '#2a6a3a'); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  const t = G.resultTimer, total = G.splits.reduce((a, b) => a + b, 0);
  text(ctx, 'RUN COMPLETE!', W / 2, 18, PAL.yellow, { align: 'center', scale: 3, shadow: PAL.black });
  text(ctx, fmtTime(total), W / 2, 44, PAL.white, { align: 'center', scale: 3, shadow: PAL.black });
  if (G.runPrev !== null && G.runPrev !== undefined) { const d = total - G.runPrev; text(ctx, (G.runPB ? 'NEW BEST RUN  ' : 'VS BEST  ') + fmtDiff(d), W / 2, 66, d <= 0 ? PAL.green : PAL.red, { align: 'center' }); }
  else text(ctx, 'FIRST FULL RUN - NEW BEST', W / 2, 66, PAL.cyan, { align: 'center' });
  const pb = Storage.data.run;
  LEVELS.forEach((lv, i) => {
    if (t < 20 + i * 10) return;
    const ms = G.splits[i]; const y = 84 + i * 12;
    text(ctx, (i + 1) + ' ' + lv.name, 30, y, PAL.white);
    text(ctx, fmtTime(ms), 230, y, PAL.white, { align: 'right' });
    const m = G.medalFor(lv, ms); if (m) text(ctx, m, 262, y, medalColor(m));
    if (pb && pb.splits[i] !== undefined && !G.runPB) { const d = ms - pb.splits[i]; text(ctx, fmtDiff(d), 350, y, d < 0 ? PAL.green : PAL.red, { align: 'right' }); }
    else if (pb && G.runPB && G.prevRunSplits && G.prevRunSplits[i] !== undefined) { const d = ms - G.prevRunSplits[i]; text(ctx, fmtDiff(d), 350, y, d < 0 ? PAL.green : PAL.red, { align: 'right' }); }
  });
  if (t > 80) { for (let i = 0; i < 3; i++) { const hx = 60 + i * 130 + Math.round(Math.sin(t * 0.1 + i) * 4), hy = 190; ctx.drawImage(HeroArt.body, hx - 8, hy - 16); } text(ctx, 'PRESS JUMP', W / 2, 200, (t & 16) ? PAL.white : '#888', { align: 'center' }); }
}

// ------------------------------------------------------------------- MAIN LOOP -------
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
function resize() {
  const fit = Math.min(window.innerWidth / W, window.innerHeight / H);
  const s = fit >= 2 ? Math.floor(fit) : Math.max(0.5, Math.floor(fit * 100) / 100); // crisp integer scale on desktops, best-fit on phones
  canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px';
  const crt = document.getElementById('crt'); crt.style.width = canvas.style.width; crt.style.height = canvas.style.height;
}
window.addEventListener('resize', resize); resize();
document.getElementById('crt').className = G.crt ? 'on' : '';

function render() {
  ctx.imageSmoothingEnabled = false;
  switch (G.state) {
    case 'title': drawTitle(ctx); break;
    case 'intro': drawIntro(ctx); break;
    case 'playing': drawWorld(ctx); drawHUD(ctx); break;
    case 'paused': drawPaused(ctx); break;
    case 'results': drawResults(ctx); break;
    case 'runcomplete': drawRunComplete(ctx); break;
  }
  if (Audio.muted) text(ctx, 'MUTED', W - 6, H - 16, '#888', { align: 'right' });
}

const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function step() { Input.update(); G.update(); }
function frame(now) {
  acc += Math.min(250, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  render();
  requestAnimationFrame(frame);
}
Input.init();
Audio.play('title');
requestAnimationFrame(frame);

// Test hook (used by automated playthrough checks; harmless in normal play)
window.__scute = { G, Input, PHYS, LEVELS, step, render, TileMap, findFloor, Hero, Storage, Audio, classes: { Drum, Crate, Thug, Rival, Walker, Shell, Flyer, Gem, Cannon, Curve } };
</script>
